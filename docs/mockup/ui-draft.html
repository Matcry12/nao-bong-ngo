<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bản nháp giao diện — Não bỏng ngô</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFC93C; --yellow-deep:#F5A623; --yellow-soft:#FFE9A8;
  --red:#E8432E; --red-deep:#C2321F; --red-soft:#FFD9D1;
  --cream:#FFF6E0; --cream-2:#FFEBC2; --paper:#FFFDF6;
  --ink:#3A2418; --ink-2:#6B4A38; --ink-3:#9A7C68;
  --green:#4FA36B; --green-soft:#D6F0DE; --blue:#3E7BD6; --blue-soft:#DCE8FB; --purple:#8A5CC8; --purple-soft:#EADFF8;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
  --shadow-s:0 2px 0 rgba(120,70,20,.12),0 6px 14px rgba(120,70,20,.10);
  --shadow-l:0 24px 50px -12px rgba(90,45,10,.35),0 8px 18px rgba(90,45,10,.15);
  --font-h:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --font-b:'Be Vietnam Pro',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:var(--font-b);color:var(--ink);background:#F3E3C3;
  background-image:radial-gradient(circle at 20% 10%,#FFF1CC 0,transparent 40%),radial-gradient(circle at 90% 80%,#FFDCCF 0,transparent 40%);
  min-height:100vh;line-height:1.45}
.page-head{text-align:center;padding:36px 16px 8px}
.page-head h1{font-family:var(--font-h);font-size:clamp(26px,5vw,40px);font-weight:800;color:var(--red-deep)}
.page-head p{color:var(--ink-2);margin-top:4px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:40px 24px;justify-items:center;max-width:1400px;margin:0 auto;padding:28px 16px 64px}
@media(max-width:420px){.grid{grid-template-columns:minmax(0,1fr)}}
figure{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%}
figcaption{font-family:var(--font-h);font-weight:700;font-size:17px;color:var(--ink);text-align:center}
figcaption span{display:block;font-family:var(--font-b);font-weight:500;font-size:13px;color:var(--ink-3)}

/* phone */
.phone{width:360px;height:740px;max-width:100%;border-radius:44px;background:var(--cream);border:8px solid #2B1A10;box-shadow:var(--shadow-l);position:relative;overflow:hidden;display:flex;flex-direction:column}
.status{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 22px 0;font-size:12px;font-weight:600;color:var(--ink);position:relative;z-index:6}
.status::after{content:"";position:absolute;left:50%;top:6px;width:84px;height:18px;margin-left:-42px;border-radius:12px;background:#2B1A10}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 20px 22px;position:relative;overflow:hidden}
.bg-dots{background:radial-gradient(circle,rgba(245,166,35,.18) 2px,transparent 3px) 0 0/26px 26px,var(--cream)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:18px;font-family:var(--font-h);font-weight:800;font-size:20px;color:#fff;background:var(--red);box-shadow:0 5px 0 var(--red-deep),0 10px 18px rgba(194,50,31,.3);cursor:pointer;transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-deep)}
.btn.yellow{background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--yellow-deep),0 10px 18px rgba(245,166,35,.3)}
.btn.sm{min-height:44px;font-size:16px;border-radius:14px;box-shadow:0 3px 0 var(--red-deep)}
.card{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow-s);border:2px solid #fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--paper);border:2px solid var(--cream-2);font-size:13px;font-weight:600;color:var(--ink-2);box-shadow:var(--shadow-s)}
.chip.on{background:var(--yellow-soft);border-color:var(--yellow);color:var(--ink)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.2px}
.t-self{background:var(--red-soft);color:var(--red-deep)} .t-fam{background:var(--green-soft);color:#2D7A49}
.t-friend{background:var(--blue-soft);color:#2A5BA8} .t-school{background:var(--purple-soft);color:#6B3FA8}

/* mascot */
.mascot{display:block}
.m-bounce{animation:bounce 1.6s ease-in-out infinite;transform-origin:50% 100%}
.m-shake{animation:shake .5s ease-in-out infinite}
.m-pulse{animation:pulse 1.1s ease-in-out infinite;transform-origin:50% 60%}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-14px) scale(.97,1.04)}60%{transform:translateY(0) scale(1.05,.94)}}
@keyframes shake{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.kpop{animation:kpop 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.kpop.d2{animation-delay:.4s}.kpop.d3{animation-delay:.9s}.kpop.d4{animation-delay:1.3s}
@keyframes kpop{0%{opacity:0;transform:translateY(8px) scale(.3)}25%{opacity:1;transform:translateY(-6px) scale(1.15)}60%{opacity:1;transform:translateY(-14px) scale(1)}100%{opacity:0;transform:translateY(-26px) scale(.8)}}

/* 1 start */
.start{align-items:center;text-align:center;justify-content:space-between}
.start h2{font-family:var(--font-h);font-size:32px;line-height:1.1;font-weight:800;color:var(--red-deep);margin-top:6px}
.start h2 em{font-style:normal;color:var(--yellow-deep)}
.start .sub{color:var(--ink-2);font-size:15px;margin:8px 4px 0}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0}
.small-note{font-size:12px;color:var(--ink-3);margin-top:12px;display:flex;gap:6px;align-items:center;justify-content:center}

/* progress */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:38px;height:38px;border-radius:12px;background:var(--paper);box-shadow:var(--shadow-s);display:grid;place-items:center;font-weight:800;flex:none}
.prog{flex:1}
.prog small{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.bar{height:12px;border-radius:99px;background:var(--cream-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--yellow),var(--red))}
.badge-game{display:inline-flex;align-items:center;gap:6px;background:var(--red-soft);color:var(--red-deep);font-weight:700;font-size:12px;padding:5px 12px;border-radius:99px;align-self:flex-start}

/* 2 reading */
.read{padding:18px 18px 20px;margin-top:10px;flex:1;min-height:0;overflow:hidden;position:relative}
.read h3{font-family:var(--font-h);font-size:21px;font-weight:800;margin-bottom:8px;color:var(--red-deep)}
.read p{font-size:15px;line-height:1.65;color:var(--ink);margin-bottom:10px}
.read .fade{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,var(--paper))}
.timer{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:12px;font-weight:600}
.notif{position:absolute;left:12px;right:12px;top:34px;z-index:8;background:rgba(255,255,255,.96);border-radius:20px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 28px rgba(60,30,10,.28);border:1px solid #f0e2c8;animation:slidein 6s cubic-bezier(.2,.9,.3,1.2) infinite}
.notif.n2{animation-delay:3s;top:34px}
@keyframes slidein{0%{transform:translateY(-130px);opacity:0}8%{transform:translateY(0);opacity:1}14%{transform:translateY(-4px)}18%,48%{transform:translateY(0);opacity:1}58%,100%{transform:translateY(-130px);opacity:0}}
.app-ic{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center}
.notif b{font-size:13.5px;display:block}
.notif span{font-size:12.5px;color:var(--ink-2);display:block;line-height:1.3}
.notif time{font-size:11px;color:var(--ink-3);align-self:flex-start}

/* 3 phone down */
.pd{align-items:center;text-align:center}
.ringwrap{position:relative;width:250px;height:250px;margin:8px 0 6px;display:grid;place-items:center}
.ringwrap svg.ring{position:absolute;inset:0}
.glow{position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,60,.75),rgba(232,67,46,.0) 70%);animation:glow 1.2s ease-in-out infinite}
@keyframes glow{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.12);opacity:1}}
.bigphone{width:96px;height:164px;border-radius:20px;background:linear-gradient(160deg,#3b2a22,#1f130d);border:4px solid #120b07;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 14px 26px rgba(40,10,0,.45);animation:buzz .6s linear infinite}
.bigphone::before{content:"";position:absolute;top:6px;width:30px;height:5px;border-radius:5px;background:#000}
.bigphone .scr{width:80px;height:132px;border-radius:12px;background:linear-gradient(170deg,#FFE29A,#FF8A5C);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.bigphone .msg{width:60px;height:14px;border-radius:7px;background:rgba(255,255,255,.85)}
.bigphone .msg.s{width:44px;background:rgba(255,255,255,.6)}
@keyframes buzz{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-3px,1px) rotate(-3deg)}40%{transform:translate(3px,-1px) rotate(3deg)}60%{transform:translate(-3px,-1px) rotate(-2deg)}80%{transform:translate(3px,1px) rotate(2deg)}}
.vib{position:absolute;z-index:1;border:3px solid var(--red);border-radius:50%;opacity:.0;animation:wave 1.4s ease-out infinite}
.vib.v2{animation-delay:.7s}
@keyframes wave{0%{width:110px;height:110px;opacity:.7}100%{width:240px;height:240px;opacity:0}}
.count{position:absolute;z-index:3;bottom:20px;font-family:var(--font-h);font-weight:800;font-size:30px;color:var(--red-deep);background:var(--paper);padding:0 14px;border-radius:14px;box-shadow:var(--shadow-s)}
.dont{font-family:var(--font-h);font-weight:800;font-size:34px;color:var(--red);line-height:1;margin-top:8px;animation:pulse 1s ease-in-out infinite}
.pd .hint{font-size:14px;color:var(--ink-2);margin:8px 6px 12px}
.strip{display:flex;gap:10px;width:100%;margin-top:auto}
.strip div{flex:1;padding:10px 6px;border-radius:16px;background:var(--paper);box-shadow:var(--shadow-s);font-size:11.5px;color:var(--ink-3);font-weight:600}
.strip b{display:block;font-family:var(--font-h);font-size:22px;color:var(--ink)}

/* 4 result */
.res{align-items:center;text-align:center;overflow:hidden}
.res .badge{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:#fff;font-family:var(--font-h);font-weight:800;font-size:16px;padding:5px 16px;border-radius:99px;box-shadow:0 3px 0 var(--red-deep)}
.res h2{font-family:var(--font-h);font-size:28px;font-weight:800;line-height:1.1;color:var(--red-deep);margin:6px 0 0}
.score{font-family:var(--font-h);font-weight:800;font-size:15px;color:var(--ink-2)}
.score b{font-size:34px;color:var(--ink)}
.meter{width:100%;margin:6px 0 10px}
.meter .track{height:16px;border-radius:99px;background:linear-gradient(90deg,#FFE9A8 0 39%,#FFC93C 39% 69%,#E8432E 69% 100%);position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.meter .track::after{content:"";position:absolute;left:74%;top:-5px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#fff;border:5px solid var(--red-deep);box-shadow:var(--shadow-s)}
.meter .lbl{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink-3);margin-top:6px}
.bd{width:100%;padding:12px 14px;text-align:left;display:grid;gap:8px}
.bd .row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12.5px;font-weight:600}
.bd .row em{font-style:normal;font-weight:800;color:var(--ink)}
.bd .row .bar{grid-column:1/-1;height:9px}
.survey{margin:10px 0 8px;font-size:12.5px;color:var(--ink-2);background:var(--yellow-soft);border-radius:14px;padding:9px 12px;text-align:left}
.disc{font-size:11px;color:var(--ink-3);margin-bottom:8px}

/* 5 scenario */
.scene{height:190px;border-radius:var(--r-lg);overflow:hidden;position:relative;box-shadow:var(--shadow-s);border:2px solid #fff}
.scene svg{display:block;width:100%;height:100%}
.q{font-family:var(--font-h);font-weight:800;font-size:21px;line-height:1.2;margin:14px 2px 12px}
.q small{display:block;font-family:var(--font-b);font-weight:500;font-size:13px;color:var(--ink-2);margin-top:4px}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:center;min-height:58px;padding:10px 14px;background:var(--paper);border:3px solid var(--cream-2);border-radius:18px;font-weight:600;font-size:14.5px;box-shadow:0 3px 0 var(--cream-2);line-height:1.3}
.choice .l{width:30px;height:30px;border-radius:10px;background:var(--yellow);display:grid;place-items:center;font-family:var(--font-h);font-weight:800;flex:none}
.choice.sel{border-color:var(--red);box-shadow:0 3px 0 var(--red-soft);background:#FFF0EC}
.choice.sel .l{background:var(--red);color:#fff}

/* 6 plan */
.plan{overflow:hidden;padding-top:6px}
.plan h2{font-family:var(--font-h);font-size:24px;font-weight:800;color:var(--red-deep);line-height:1.1}
.plan h4{font-family:var(--font-h);font-size:15px;font-weight:700;margin:10px 0 6px;color:var(--ink)}
.sol{padding:10px 12px;display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.sol .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.sol b{display:block;font-size:13.5px;line-height:1.3;margin-top:3px}
.sol p{font-size:12px;color:var(--ink-2);line-height:1.35}
.days{display:flex;gap:6px;justify-content:space-between}
.day{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-3)}
.day i{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:50%;margin-bottom:3px;font-style:normal;font-size:14px;background:var(--cream-2);border:2px solid var(--cream-2)}
.day.done i{background:var(--green);color:#fff;border-color:var(--green)}
.day.cur i{background:var(--paper);border:3px solid var(--red);color:var(--red);animation:pulse 1.2s infinite}
.day.cur{color:var(--red-deep)}
.task{margin-top:8px;padding:9px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center;background:var(--red-soft);border-radius:14px;font-weight:600}

/* 7 demo */
.demo{overflow:hidden;background:#2B1A10;color:#FFEFD0;padding-top:6px}
.demo h2{font-family:var(--font-h);font-size:22px;font-weight:800;color:var(--yellow);display:flex;align-items:center;gap:8px}
.demo .lock{font-size:11px;font-weight:700;background:rgba(255,201,60,.18);color:var(--yellow);padding:3px 10px;border-radius:99px}
.demo h5{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:#C9A98A;margin:12px 0 6px}
.jump{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jb{background:#3F2819;border:2px solid #5A3A25;border-radius:14px;padding:9px 11px;font-size:12.5px;font-weight:600;color:#FFEFD0;min-height:44px;display:flex;gap:8px;align-items:center}
.jb b{font-family:var(--font-h);color:var(--yellow);font-size:15px}
.nums{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.nums span{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:#3F2819;border:2px solid #5A3A25;font-family:var(--font-h);font-weight:700;font-size:14px;color:var(--yellow)}
.chart{background:#3F2819;border-radius:18px;padding:12px 14px}
.chart .t{font-size:12px;color:#E9CDB0;margin-bottom:8px;font-weight:600}
.hb{display:grid;grid-template-columns:96px 1fr 50px;align-items:center;gap:8px;margin:7px 0;font-size:11.5px;line-height:1.25;font-weight:600}
.hb .tr{height:16px;background:#2B1A10;border-radius:99px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:99px}
.hb b{font-family:var(--font-h);font-size:14px;text-align:right;color:#fff}
.tabs{display:flex;gap:8px;margin-top:10px}
.tabs .btn{min-height:42px;font-size:14px;border-radius:13px;box-shadow:0 3px 0 var(--red-deep)}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

    <ellipse cx="100" cy="184" rx="54" ry="8" fill="#3A2418" opacity=".12"/>
    <!-- puffs peeking out -->
    <g stroke="#E9B861" stroke-width="2.5">
      <circle cx="68" cy="58" r="26" fill="url(#gPuff)"/>

    <!-- face -->
    <ellipse cx="80" cy="116" rx="8" ry="10" fill="#3A2418"/><ellipse cx="120" cy="116" rx="8" ry="10" fill="#3A2418"/>
    <circle cx="83" cy="112" r="3" fill="#fff"/><circle cx="123" cy="112" r="3" fill="#fff"/>
    <ellipse cx="66" cy="134" rx="9" ry="6" fill="#FF7A59" opacity=".6"/><ellipse cx="134" cy="134" rx="9" ry="6" fill="#FF7A59" opacity=".6"/>
