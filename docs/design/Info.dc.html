<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thông tin</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&amp;display=swap">
<style>
body{margin:0;background:#fff}
*{box-sizing:border-box}
.btn{transition:transform 100ms ease-out, box-shadow 100ms ease-out}
.btn:active{transform:translateY(4px);box-shadow:none !important}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
a{color:#2667D9}a:hover{color:#1D4FA8}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; font-family: 'Nunito', sans-serif; font-weight: 600; color: #3D3D3D; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 8px">
<a href="Main.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #6F6F6F"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div role="progressbar" aria-label="Tiến độ" aria-valuenow="5" aria-valuemin="0" aria-valuemax="100" style="flex: 1; height: 16px; border-radius: 8px; background: #E8E8E8; overflow: hidden"><div style="width: 5%; height: 100%; border-radius: 8px; background: #FF9F1C"></div></div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 16px 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 22px; font-weight: 800; line-height: 1.3">Kể chút về bạn nhé</h1>
<p style="margin: 0; font-size: 15px; color: #6F6F6F">Không bắt buộc. Chỉ để so sánh với bạn cùng lứa.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="truong" style="font-size: 15px; font-weight: 800">Trường</label>
<select id="truong" style="height: 56px; padding: 0 16px; border: 2px solid #E8E8E8; border-radius: 16px; background: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; color: #3D3D3D">
<option>Chọn trường</option>
<option>[TÊN TRƯỜNG]</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="lop" style="font-size: 15px; font-weight: 800">Lớp</label>
<select id="lop" style="height: 56px; padding: 0 16px; border: 2px solid #E8E8E8; border-radius: 16px; background: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; color: #3D3D3D">
<option>Chọn lớp</option>
<option>Lớp 10</option><option>Lớp 11</option><option>Lớp 12</option>
</select>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 15px; font-weight: 800">Giới tính</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{genders}}" as="g" hint-placeholder-count="3">
<button type="button" onClick="{{g.pick}}" aria-pressed="{{g.on}}" style="{{g.style}}">{{g.label}}</button>
</sc-for>
</div>
</fieldset>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 20px 32px; border-top: 2px solid #E8E8E8">
<a class="btn" href="Intro.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: #FF9F1C; box-shadow: 0 4px 0 #E07F00; color: #3D2A00; font-size: 17px; font-weight: 800; letter-spacing: 0.04em; text-decoration: none">TIẾP TỤC</a>
<a href="Intro.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; color: #2667D9; font-size: 17px; font-weight: 800; letter-spacing: 0.04em; text-decoration: none">BỎ QUA</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.g) || 'nu';
const base = 'height: 52px; border-radius: 16px; font-family: inherit; font-size: 17px; cursor: pointer; ';
const off = base + 'border: 2px solid #E8E8E8; box-shadow: 0 2px 0 #E8E8E8; background: #FFFFFF; color: #3D3D3D; font-weight: 600';
const on = base + 'border: 2px solid #3A86FF; box-shadow: 0 2px 0 #3A86FF; background: #EAF2FF; color: #1D4FA8; font-weight: 800';
const list = [['nam','Nam'],['nu','Nữ'],['khac','Khác']];
return {
genders: list.map(([id, label]) => ({ label, on: sel === id ? 'true' : 'false', style: sel === id ? on : off, pick: () => this.setState({ g: id }) }))
};
}
}
</script>
</body>
</html>
