<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kết quả</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&amp;display=swap">
<style>
body{margin:0;background:#fff}
*{box-sizing:border-box}
.btn{transition:transform 100ms ease-out, box-shadow 100ms ease-out}
.btn:active{transform:translateY(4px);box-shadow:none !important}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
a{color:#2667D9}a:hover{color:#1D4FA8}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; font-family: 'Nunito', sans-serif; font-weight: 600; color: #3D3D3D; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 8px">
<a href="Main.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #6F6F6F"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div style="flex: 1; font-size: 15px; font-weight: 800; color: #6F6F6F; letter-spacing: 0.04em; text-align: center; margin-right: 44px">KẾT QUẢ 1/2</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 16px 20px; text-align: center">
<dc-import name="Kernel" mood="{{mood}}" size="200" hint-size="200px,200px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 8px; align-items: center">
<div style="font-size: 15px; font-weight: 800; letter-spacing: 0.04em; color: #6F6F6F">BẠN LÀ</div>
<h1 style="margin: 0; font-size: 28px; font-weight: 800">{{persona}}</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #6F6F6F; max-width: 300px">{{line}}</p>
</div>
<div style="display: flex; gap: 16px; width: 100%">
<div style="flex: 1; padding: 16px; border: 2px solid #E8E8E8; border-radius: 16px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 15px; color: #6F6F6F">Điểm “nổ”</div>
<div style="font-size: 28px; font-weight: 800">{{score}}<span style="font-size: 17px; color: #6F6F6F">/100</span></div>
</div>
<div style="flex: 1; padding: 16px; border: 2px solid #E8E8E8; border-radius: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 15px; color: #6F6F6F">Mức độ</div>
<div style="display: flex; gap: 4px" aria-hidden="true">
<sc-for list="{{segs}}" as="s" hint-placeholder-count="3"><div style="{{s.style}}"></div></sc-for>
</div>
<div style="font-size: 17px; font-weight: 800; color: {{levelColor}}">{{levelText}}</div>
</div>
</div>
</div>
<div style="padding: 16px 20px 32px">
<a class="btn" href="Result2.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: #FF9F1C; box-shadow: 0 4px 0 #E07F00; color: #3D2A00; font-size: 17px; font-weight: 800; letter-spacing: 0.04em; text-decoration: none">XEM CHI TIẾT</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"level":{"editor":"enum","options":["low","medium","high"],"default":"medium"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const lv = this.props.level ?? 'medium';
const d = {
low: { mood: 'calm', persona: 'Bắp Bình Tĩnh', line: 'Não bạn khá vững, thông báo khó làm bạn xao nhãng.', score: 28, n: 1, levelText: 'Thấp', levelColor: '#1F7A4A' },
medium: { mood: 'wobble', persona: 'Bắp Lăn Tăn', line: 'Bạn tập trung được, nhưng thông báo hay kéo bạn đi.', score: 62, n: 2, levelText: 'Vừa', levelColor: '#8A4B00' },
high: { mood: 'popped', persona: 'Bắp Nổ Tung', line: 'Não bạn đang hơi “nổ” nhiều đó! Mình cùng hạ nhiệt nhé.', score: 85, n: 3, levelText: 'Cao', levelColor: '#A3261F' }
}[lv];
const fill = lv === 'high' ? '#F25C54' : '#FF9F1C';
return {
...d,
segs: [0, 1, 2].map((i) => ({ style: 'flex: 1; height: 12px; border-radius: 6px; background: ' + (i < d.n ? fill : '#E8E8E8') }))
};
}
}
</script>
</body>
</html>
