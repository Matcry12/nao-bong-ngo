<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tình huống 3/8</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&amp;display=swap">
<style>
body{margin:0;background:#fff}
*{box-sizing:border-box}
.btn{transition:transform 100ms ease-out, box-shadow 100ms ease-out}
.btn:active{transform:translateY(4px);box-shadow:none !important}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
a{color:#2667D9}a:hover{color:#1D4FA8}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; font-family: 'Nunito', sans-serif; font-weight: 600; color: #3D3D3D; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 8px">
<a href="Main.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #6F6F6F"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div role="progressbar" aria-label="Tình huống 3 trên 8" aria-valuenow="3" aria-valuemin="0" aria-valuemax="8" style="flex: 1; height: 16px; border-radius: 8px; background: #E8E8E8; overflow: hidden"><div style="width: 37.5%; height: 100%; border-radius: 8px; background: #FF9F1C"></div></div>
<div style="font-size: 15px; font-weight: 800; color: #6F6F6F">3/8</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 16px">
<div style="border-radius: 16px; background: #FFF8EC; display: flex; justify-content: center">
<svg width="350" height="160" viewBox="0 0 350 160" role="img" aria-label="Bàn học với vở bài tập và điện thoại đang sáng">
<rect x="0" y="118" width="350" height="42" fill="#FFE2A8"></rect>
<rect x="60" y="70" width="140" height="56" rx="6" fill="#FFFFFF"></rect>
<rect x="74" y="84" width="80" height="6" rx="3" fill="#E8E8E8"></rect>
<rect x="74" y="98" width="100" height="6" rx="3" fill="#E8E8E8"></rect>
<rect x="74" y="112" width="60" height="6" rx="3" fill="#E8E8E8"></rect>
<rect x="210" y="40" width="10" height="86" rx="5" fill="#3A86FF" transform="rotate(20 215 83)"></rect>
<rect x="246" y="76" width="50" height="50" rx="10" fill="#4A4A4A"></rect>
<rect x="252" y="82" width="38" height="38" rx="6" fill="#EAF2FF"></rect>
<circle cx="288" cy="80" r="8" fill="#FF9F1C"></circle>
<path d="M306 70q8 10 0 20M318 62q14 18 0 36" fill="none" stroke="#E07F00" stroke-width="4" stroke-linecap="round"></path>
</svg>
</div>
<h1 style="margin: 0; font-size: 22px; font-weight: 800; line-height: 1.35">Đang làm bài tập thì điện thoại sáng lên. Bạn sẽ…</h1>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{choices}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="padding: 16px 20px 32px; border-top: 2px solid #E8E8E8">
<a class="btn" href="Plan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: #FF9F1C; box-shadow: 0 4px 0 #E07F00; color: #3D2A00; font-size: 17px; font-weight: 800; letter-spacing: 0.04em; text-decoration: none">TIẾP TỤC</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state || {}).picked ?? 1;
const base = 'width: 100%; min-height: 56px; padding: 12px 16px; text-align: left; border-radius: 16px; font-family: inherit; font-size: 17px; line-height: 1.4; cursor: pointer; ';
const off = base + 'border: 2px solid #E8E8E8; box-shadow: 0 2px 0 #E8E8E8; background: #FFFFFF; color: #3D3D3D; font-weight: 600';
const on = base + 'border: 2px solid #3A86FF; box-shadow: 0 2px 0 #3A86FF; background: #EAF2FF; color: #1D4FA8; font-weight: 800';
const list = ['Xem ngay, chỉ một chút thôi', 'Làm xong câu này rồi xem', 'Úp máy xuống, học tiếp', 'Tắt thông báo đến khi học xong'];
return {
choices: list.map((label, i) => ({ label, on: picked === i ? 'true' : 'false', style: picked === i ? on : off, pick: () => this.setState({ picked: i }) }))
};
}
}
</script>
</body>
</html>
