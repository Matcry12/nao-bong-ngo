<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Câu hỏi đọc hiểu</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&amp;display=swap">
<style>
body{margin:0;background:#fff}
*{box-sizing:border-box}
.btn{transition:transform 100ms ease-out, box-shadow 100ms ease-out}
.btn:active{transform:translateY(4px);box-shadow:none !important}
.banner{animation:up 250ms ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.btn{transition:none}.banner{animation:none}}
a{color:#2667D9}a:hover{color:#1D4FA8}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; font-family: 'Nunito', sans-serif; font-weight: 600; color: #3D3D3D; background: #FFFFFF; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 8px">
<a href="Main.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #6F6F6F"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div role="progressbar" aria-label="Tiến độ" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="flex: 1; height: 16px; border-radius: 8px; background: #E8E8E8; overflow: hidden"><div style="width: 25%; height: 100%; border-radius: 8px; background: #FF9F1C"></div></div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 16px 20px">
<div style="font-size: 15px; font-weight: 800; color: #6F6F6F; letter-spacing: 0.04em">CÂU 1/3</div>
<h1 style="margin: 0; font-size: 22px; font-weight: 800; line-height: 1.35">Theo đoạn văn, điều gì làm hạt bắp nổ?</h1>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{choices}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>
<sc-if value="{{showCheck}}" hint-placeholder-val="{{ false }}">
<div style="padding: 16px 20px 32px; border-top: 2px solid #E8E8E8">
<button class="btn" type="button" onClick="{{check}}" style="width: 100%; height: 52px; border: 0; border-radius: 16px; background: #FF9F1C; box-shadow: 0 4px 0 #E07F00; color: #3D2A00; font-family: inherit; font-size: 17px; font-weight: 800; letter-spacing: 0.04em; cursor: pointer">KIỂM TRA</button>
</div>
</sc-if>
<sc-if value="{{isRight}}" hint-placeholder-val="{{ true }}">
<div class="banner" role="status" style="display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 32px; background: #E6F6EC">
<div style="display: flex; align-items: center; gap: 12px; color: #1F7A4A; font-size: 17px; font-weight: 800">
<div style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
Chính xác! Bạn vẫn tập trung tốt.</div>
<a class="btn" href="Patience.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: #3CB371; box-shadow: 0 4px 0 #2A8A55; color: #0F3D24; font-size: 17px; font-weight: 800; letter-spacing: 0.04em; text-decoration: none">TIẾP TỤC</a>
</div>
</sc-if>
<sc-if value="{{isWrong}}" hint-placeholder-val="{{ false }}">
<div class="banner" role="status" style="display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 32px; background: #FDECEB">
<div style="display: flex; flex-direction: column; gap: 4px; color: #A3261F">
<div style="display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 800">
<div style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></div>
Chưa đúng, không sao!</div>
<div style="font-size: 15px; padding-left: 52px">Đáp án: hơi nước làm áp suất tăng.</div>
</div>
<a class="btn" href="Patience.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: #F25C54; box-shadow: 0 4px 0 #C9403A; color: #3B0906; font-size: 17px; font-weight: 800; letter-spacing: 0.04em; text-decoration: none">TIẾP TỤC</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const picked = st.picked ?? 'b';
const checked = st.checked ?? true;
const base = 'width: 100%; min-height: 60px; padding: 14px 16px; text-align: left; border-radius: 16px; font-family: inherit; font-size: 17px; line-height: 1.4; cursor: pointer; ';
const off = base + 'border: 2px solid #E8E8E8; box-shadow: 0 2px 0 #E8E8E8; background: #FFFFFF; color: #3D3D3D; font-weight: 600';
const on = base + 'border: 2px solid #3A86FF; box-shadow: 0 2px 0 #3A86FF; background: #EAF2FF; color: #1D4FA8; font-weight: 800';
const list = [['a','Lớp vỏ bị khô và nứt ra'],['b','Hơi nước làm áp suất bên trong tăng'],['c','Tinh bột bị cháy đen']];
return {
choices: list.map(([id, label]) => ({ label, on: picked === id ? 'true' : 'false', style: picked === id ? on : off, pick: () => this.setState({ picked: id, checked: false }) })),
check: () => this.setState({ picked, checked: true }),
showCheck: !checked,
isRight: checked && picked === 'b',
isWrong: checked && picked !== 'b'
};
}
}
</script>
</body>
</html>
