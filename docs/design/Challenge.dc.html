<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thử thách 7 ngày</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&amp;display=swap">
<style>
body{margin:0;background:#fff}
*{box-sizing:border-box}
.btn{transition:transform 100ms ease-out, box-shadow 100ms ease-out}
.btn:active{transform:translateY(4px);box-shadow:none !important}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
a{color:#2667D9}a:hover{color:#1D4FA8}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; font-family: 'Nunito', sans-serif; font-weight: 600; color: #3D3D3D; background: #FFFFFF">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 2px solid #E8E8E8">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Thử thách 7 ngày</h1>
<div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #FFF8EC; color: #8A4B00; font-size: 17px; font-weight: 800" aria-label="Chuỗi 3 ngày">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#FF9F1C" aria-hidden="true"><path d="M12 2c1 4 7 6.5 7 12a7 7 0 0 1-14 0c0-3.5 2.2-5 3.4-7 1 2.2 2.2 2.8 3.4 2.8C11.8 6.5 11 4.5 12 2Z"></path></svg>
3 ngày</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 20px">
<sc-for list="{{nodes}}" as="n" hint-placeholder-count="7">
<div style="{{n.wrap}}">
<sc-if value="{{n.isToday}}" hint-placeholder-val="{{ false }}">
<div style="padding: 4px 12px; border: 2px solid #E8E8E8; border-radius: 12px; background: #FFFFFF; color: #8A4B00; font-size: 14px; font-weight: 800; letter-spacing: 0.04em">HÔM NAY</div>
</sc-if>
<div role="img" aria-label="{{n.aria}}" style="{{n.style}}">
<sc-if value="{{n.isDone}}" hint-placeholder-val="{{ true }}">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0F3D24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
<sc-if value="{{n.isToday}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 28px; font-weight: 800; color: #3D2A00">{{n.day}}</span>
</sc-if>
<sc-if value="{{n.isLocked}}" hint-placeholder-val="{{ false }}">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6F6F6F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
</sc-if>
<sc-if value="{{n.isRetest}}" hint-placeholder-val="{{ false }}">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6F6F6F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg>
</sc-if>
</div>
<sc-if value="{{n.isRetest}}" hint-placeholder-val="{{ false }}">
<div style="font-size: 15px; font-weight: 800; color: #6F6F6F">Ngày 7 · Kiểm tra lại</div>
</sc-if>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 32px; border-top: 2px solid #E8E8E8">
<div style="font-size: 17px"><span style="font-weight: 800">Hôm nay:</span> Úp điện thoại khi ăn tối.</div>
<a class="btn" href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: #FF9F1C; box-shadow: 0 4px 0 #E07F00; color: #3D2A00; font-size: 17px; font-weight: 800; letter-spacing: 0.04em; text-decoration: none">BẮT ĐẦU</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"today":{"editor":"int","min":1,"max":7,"default":4},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const today = this.props.today ?? 4;
const shift = [0, 56, 84, 56, 0, -56, -84];
const nodes = shift.map((x, i) => {
const day = i + 1;
const isDone = day < today;
const isToday = day === today;
const isRetest = day === 7 && !isDone && !isToday;
const isLocked = day > today && !isRetest;
const size = isToday ? 76 : 60;
let fill = '#E8E8E8', lip = '#CFCFCF';
if (isDone) { fill = '#3CB371'; lip = '#2A8A55'; }
if (isToday) { fill = '#FF9F1C'; lip = '#E07F00'; }
return {
day, isDone, isToday, isLocked, isRetest,
aria: 'Ngày ' + day + (isDone ? ', đã xong' : isToday ? ', hôm nay' : ', chưa mở'),
wrap: 'display: flex; flex-direction: column; align-items: center; gap: 6px; transform: translateX(' + x + 'px)',
style: 'width: ' + size + 'px; height: ' + size + 'px; border-radius: 999px; background: ' + fill + '; box-shadow: 0 5px 0 ' + lip + '; display: flex; align-items: center; justify-content: center'
};
});
return { nodes };
}
}
</script>
</body>
</html>
